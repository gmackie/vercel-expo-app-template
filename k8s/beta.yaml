apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-beta
  namespace: ${NAMESPACE}
  labels:
    app: web
    environment: beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
      environment: beta
  template:
    metadata:
      labels:
        app: web
        environment: beta
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: web
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: web-secrets
            - configMapRef:
                name: web-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-beta
  namespace: ${NAMESPACE}
spec:
  selector:
    app: web
    environment: beta
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-beta
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - beta.${NAMESPACE}.gmac.io
      secretName: ${NAMESPACE}-beta-tls
  rules:
    - host: beta.${NAMESPACE}.gmac.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-beta
                port:
                  number: 80
